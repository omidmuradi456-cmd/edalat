<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت صرافی و حواله‌داری عدالت</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background-color: #f4f6f9; font-family: Tahoma, Arial, sans-serif; padding-bottom: 30px; }
    .header-box { background: linear-gradient(135deg, #003f7f, #0d6efd); color: white; padding: 20px; border-radius: 12px; }
    .card { border-radius: 10px; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
    #loginOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #f4f6f9; z-index: 9999; display: flex;
      align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

<!-- صفحه قفل و ورود با رمز عبور -->
<div id="loginOverlay">
  <div class="card p-4 shadow-lg text-center" style="max-width: 360px; width: 90%;">
    <h5 class="fw-bold text-primary mb-3">🏛 صرافی و حواله‌داری عدالت</h5>
    <p class="small text-muted mb-3">ورود اختصاصی مدیریت (دکتر روح‌الله مرادی)</p>
    <div class="mb-3">
      <input type="password" id="passInput" class="form-control text-center" placeholder="رمز عبور را وارد کنید">
    </div>
    <button class="btn btn-primary w-100 fw-bold" onclick="checkPassword()">ورود به پنل 🔒</button>
    <p id="errorMsg" class="text-danger small mt-2 d-none">⛔️ رمز عبور اشتباه است!</p>
  </div>
</div>

<!-- محتوای اصلی پنل مدیریت -->
<div class="container my-3" id="adminContent" style="display:none;">
  
  <div class="header-box text-center shadow-sm mb-3">
    <h4 class="fw-bold mb-1">صرافی و حواله‌داری عدالت</h4>
    <p class="mb-1 small">دکتر روح‌الله مرادی - مسئول حواله‌داری عمومی - پشتیبانی:</p>
    <p class="fw-bold dir-ltr mb-2">+989962671189</p>
    <span class="badge bg-success">متصل به تلگرام 🟢</span>
  </div>

  <!-- دکمه‌های بک‌آپ -->
  <div class="row g-2 mb-3">
    <div class="col-6">
      <button class="btn btn-outline-primary w-100 btn-sm fw-bold">📥 دانلود فایل پشتیبان (بک‌آب)</button>
    </div>
    <div class="col-6">
      <button class="btn btn-outline-success w-100 btn-sm fw-bold">📦 بازیابی پشتیبان</button>
    </div>
  </div>

  <!-- بخش نرخ روزانه ارزها -->
  <div class="card p-3">
    <h6 class="fw-bold text-dark mb-3">⚙️ نرخ روزانه ارزها (جهت حذف روی نرخ کلیک کنید)</h6>
    <div class="row g-2 mb-2">
      <div class="col-6">
        <select class="form-select btn-sm" id="fromCurr">
          <option value="یورو">یورو</option>
          <option value="دلار">دلار</option>
        </select>
      </div>
      <div class="col-6">
        <select class="form-select btn-sm" id="toCurr">
          <option value="افغانی">افغانی</option>
          <option value="تومان">تومان</option>
        </select>
      </div>
    </div>
    <div class="input-group mb-2">
      <input type="number" class="form-control" placeholder="نرخ تبدیل">
      <button class="btn btn-primary fw-bold" type="button">ثبت نرخ</button>
    </div>
  </div>

  <!-- جستجوی مشتری -->
  <div class="card p-3">
    <h6 class="fw-bold text-dark mb-2">🔍 جستجوی مشتری</h6>
    <div class="input-group">
      <input type="text" class="form-control" placeholder="نام یا شماره تلفن...">
      <button class="btn btn-primary" type="button">جستجو</button>
      <button class="btn btn-success" type="button">مشتری جدید</button>
    </div>
  </div>

</div>

<script>
  // رمز عبور ورود به پنل مدیریت (می‌توانید رمز را تغییر دهید)
  const ADMIN_PASS = "123";

  function checkPassword() {
    let input = document.getElementById('passInput').value;
    if (input === ADMIN_PASS) {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
    } else {
      document.getElementById('errorMsg').classList.remove('d-none');
    }
  }
</script>

</body>
</html>
